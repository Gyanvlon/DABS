# Azure DevOps Pipeline for Databricks Bundle CI/CD

trigger:
  branches:
    include:
      - master
      - main
  paths:
    exclude:
      - README.md
      - .gitignore

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: Databricks-dev  # Variable group in Azure DevOps

stages:
  # Stage 1: Validate Bundle
  - stage: Validate
    displayName: 'Validate Bundle Configuration'
    jobs:
      - job: ValidateJob
        displayName: 'Validate DAB'
        steps:
          - checkout: self
            displayName: 'Checkout code'
          
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
            displayName: 'Use Python 3.11'
          
          - script: |
              curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            displayName: 'Install Databricks CLI'
          
          - script: |
              export DATABRICKS_HOST=$(DATABRICKS_HOST)
              export DATABRICKS_TOKEN=$(DATABRICKS_TOKEN)
              databricks bundle validate --strict --target dev
            displayName: 'Validate Bundle (dev)'
            workingDirectory: $(Build.SourcesDirectory)

  # Stage 2: Deploy to Dev
  - stage: DeployDev
    displayName: 'Deploy to Dev Environment'
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: DeployDevJob
        displayName: 'Deploy to Dev'
        steps:
          - checkout: self
            displayName: 'Checkout code'
          
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
            displayName: 'Use Python 3.11'
          
          - script: |
              curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            displayName: 'Install Databricks CLI'
          
          - script: |
              export DATABRICKS_HOST=$(DATABRICKS_HOST)
              export DATABRICKS_TOKEN=$(DATABRICKS_TOKEN)
              databricks bundle deploy --target dev --auto-approve
            displayName: 'Deploy Bundle to Dev'
            workingDirectory: $(Build.SourcesDirectory)
          
          - script: |
              export DATABRICKS_HOST=$(DATABRICKS_HOST)
              export DATABRICKS_TOKEN=$(DATABRICKS_TOKEN)
              databricks bundle summary --target dev
            displayName: 'Show Deployment Summary'
            workingDirectory: $(Build.SourcesDirectory)

  # Stage 3: Deploy to QA
  - stage: DeployQA
    displayName: 'Deploy to QA Environment'
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DeployQAJob
        displayName: 'Deploy to QA'
        steps:
          - checkout: self
            displayName: 'Checkout code'
          
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
            displayName: 'Use Python 3.11'
          
          - script: |
              curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            displayName: 'Install Databricks CLI'
          
          - script: |
              export DATABRICKS_HOST=$(DATABRICKS_HOST_QA)
              export DATABRICKS_TOKEN=$(DATABRICKS_TOKEN_QA)
              databricks bundle deploy --target qa --auto-approve
            displayName: 'Deploy Bundle to QA'
            workingDirectory: $(Build.SourcesDirectory)
          
          - script: |
              export DATABRICKS_HOST=$(DATABRICKS_HOST_QA)
              export DATABRICKS_TOKEN=$(DATABRICKS_TOKEN_QA)
              databricks bundle summary --target qa
            displayName: 'Show Deployment Summary'
            workingDirectory: $(Build.SourcesDirectory)
